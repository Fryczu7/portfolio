<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michał Frycz – showreel</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--tlo:#160709;--txt:#f6ece6;--szary:#dcc8c0}
*{box-sizing:border-box;margin:0}
html{background:var(--tlo);color:var(--txt);font-family:"Schibsted Grotesk",system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;gap:18px;padding:24px;text-align:center}
h1{font:900 clamp(32px,6vw,72px)/.9 "Schibsted Grotesk";letter-spacing:-.045em;text-transform:uppercase}
video{display:block;width:min(100%,1280px);max-height:calc(100vh - 190px);border-radius:14px;background:#000;margin:0 auto}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{color:#fff;background:#8a1f1a;box-shadow:inset 0 0 0 1px #df8f75;text-decoration:none;font:700 16px "Schibsted Grotesk";padding:14px 22px;border-radius:999px;min-height:48px;display:inline-flex;align-items:center}
a.drugi{background:none;color:var(--txt);border:1px solid rgba(244,244,242,.35)}
a:focus-visible{outline:2px solid var(--txt);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Michał Frycz · showreel</h1>
  <video id="sr" controls playsinline preload="metadata" aria-label="Showreel, 55 sekund"></video>
  <nav style="margin-top:18px"><a href="../firmy/">Dla firm</a><a class="drugi" href="../praca/">Dla pracodawców</a></nav>
</main>
<script>
const pion=matchMedia('(max-aspect-ratio: 4/5)').matches,v=document.getElementById('sr');
v.poster=pion?'okladka-9x16.jpg':'okladka-16x9.jpg';v.src=pion?'showreel-9x16.mp4':'showreel-16x9.mp4';
if(pion)v.style.maxHeight='calc(100vh - 170px)';
</script>
</body>
</html>
